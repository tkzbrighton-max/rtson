<svg width="1000" height="1250" viewBox="0 0 1000 1250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradPurple" x1="0" y1="0" x2="1000" y2="1250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14062b" />
      <stop offset="25%" stop-color="#2a0d54" />
      <stop offset="55%" stop-color="#15082e" />
      <stop offset="100%" stop-color="#0a0317" />
    </linearGradient>
    <linearGradient id="purpleRibbon" x1="0" y1="0" x2="350" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="cardShadow" x="-10" y="-10" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="1250" fill="url(#bgGradPurple)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1000" y2="100" /><line x1="0" y1="200" x2="1000" y2="200" /><line x1="0" y1="300" x2="1000" y2="300" />
    <line x1="0" y1="400" x2="1000" y2="400" /><line x1="0" y1="500" x2="1000" y2="500" /><line x1="0" y1="600" x2="1000" y2="600" />
    <line x1="0" y1="700" x2="1000" y2="700" /><line x1="0" y1="800" x2="1000" y2="800" /><line x1="0" y1="900" x2="1000" y2="900" />
    <line x1="200" y1="0" x2="200" y2="1250" /><line x1="400" y1="0" x2="400" y2="1250" /><line x1="600" y1="0" x2="600" y2="1250" /><line x1="800" y1="0" x2="800" y2="1250" />
  </g>

  <!-- Header: Rtson Logo Left -->
  <g transform="translate(60, 45)">
    <!-- R Logo Icon -->
    <path d="M14,0 H52 C68,0 80,12 80,28 C80,44 68,54 52,54 L38,54 L38,80 L26,80 L26,54 L12,54 L12,38 L26,24 L26,14 L0,14 Z" fill="#9333ea" />
    <path d="M26,14 H48 C58,14 64,20 64,28 C64,36 58,42 48,42 H38 L26,30 Z" fill="#ffffff" />
    <path d="M0,32 L12,20 L12,38 L0,50 Z" fill="#a855f7" />
    <path d="M40,42 L70,80 L52,80 L28,48 Z" fill="#ffffff" />
    <!-- Typography -->
    <text x="96" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" fill="#ffffff">Rtson</text>
    <text x="96" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" fill="#a855f7">Creations</text>
    <text x="98" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="8.5" fill="#e2e8f0" letter-spacing="3.2">DESIGN • WEB • DIGITAL</text>
  </g>

  <!-- Header Right: Script Motto -->
  <g transform="translate(710, 60)">
    <text x="0" y="24" font-family="'Caveat', 'Brush Script MT', cursive, sans-serif" font-weight="700" font-size="38" fill="#ffffff">Your Vision</text>
    <text x="35" y="62" font-family="'Caveat', 'Brush Script MT', cursive, sans-serif" font-weight="700" font-size="44" fill="#c084fc">Our Design</text>
  </g>

  <!-- Headline Section Left -->
  <g transform="translate(60, 175)">
    <!-- Professional Ribbon Badge -->
    <rect x="0" y="0" width="280" height="42" rx="8" fill="url(#purpleRibbon)" />
    <text x="140" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="19" fill="#ffffff" text-anchor="middle" letter-spacing="3.5">PROFESSIONAL</text>

    <!-- Main Title -->
    <text x="0" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="64" fill="#ffffff" letter-spacing="-1">WEBSITE</text>
    <text x="0" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="52" fill="#c084fc" letter-spacing="-0.5">DESIGN SERVICES</text>
    <text x="0" y="205" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" fill="#ffffff">Modern. Responsive. Affordable.</text>
    
    <text x="0" y="245" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="15" fill="#cbd5e1" width="460">
      <tspan x="0" dy="0">We create stunning, user-friendly websites that help</tspan>
      <tspan x="0" dy="22">you stand out, connect with your audience and</tspan>
      <tspan x="0" dy="22">grow your brand online.</tspan>
    </text>
  </g>

  <!-- Visual Hero Right: Robot Mascot with Purple Umbrella -->
  <g transform="translate(530, 150)">
    <!-- Ambient Umbrella Glow -->
    <ellipse cx="230" cy="180" rx="190" ry="130" fill="#a855f7" opacity="0.3" filter="blur(40px)" />
    
    <!-- Umbrella Canopy -->
    <path d="M70,180 C70,70 390,70 390,180 Z" fill="#6b21a8" />
    <path d="M70,180 Q150,165 230,175 Q310,165 390,180 Q310,140 230,145 Q150,140 70,180 Z" fill="#7e22ce" opacity="0.6" />
    <circle cx="230" cy="68" r="6" fill="#e9d5ff" />
    <rect x="228" y="70" width="4" height="150" fill="#d8b4fe" />

    <!-- Mascot Robot Head -->
    <rect x="175" y="195" width="110" height="85" rx="36" fill="#ffffff" stroke="#9333ea" stroke-width="4" />
    <rect x="188" y="208" width="84" height="58" rx="22" fill="#090514" />
    <!-- Happy Glowing Eyes -->
    <path d="M205,232 Q215,224 225,232" stroke="#c084fc" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M235,232 Q245,224 255,232" stroke="#c084fc" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Robot Suit & Tie -->
    <path d="M150,285 L310,285 L330,400 L130,400 Z" fill="#0f0926" />
    <polygon points="215,285 245,285 238,340 230,360 222,340" fill="#7c3aed" />
    <polygon points="220,285 240,285 235,295 225,295" fill="#ffffff" />
  </g>

  <!-- ========================================================================= -->
  <!-- 6 CORE WEBSITE DESIGN SERVICES CARDS                                      -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 480)">
    <!-- Card 1: Website Design -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="280" height="165" rx="20" fill="#ffffff" />
      <rect x="20" y="20" width="44" height="44" rx="12" fill="#f3e8ff" />
      <text x="42" y="48" font-family="'Plus Jakarta Sans', monospace" font-weight="900" font-size="20" fill="#7c3aed" text-anchor="middle">&lt;/&gt;</text>
      <text x="20" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#0f172a">Website Design</text>
      <text x="20" y="118" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748b" width="240">
        <tspan x="20" dy="0">Custom, modern websites built</tspan>
        <tspan x="20" dy="16">to match your brand and goals.</tspan>
      </text>
    </g>

    <!-- Card 2: Blog Websites -->
    <g transform="translate(300, 0)" filter="url(#cardShadow)">
      <rect width="280" height="165" rx="20" fill="#ffffff" />
      <rect x="20" y="20" width="44" height="44" rx="12" fill="#f3e8ff" />
      <text x="42" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#7c3aed" text-anchor="middle">📝</text>
      <text x="20" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#0f172a">Blog Websites</text>
      <text x="20" y="118" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748b">
        <tspan x="20" dy="0">Share your ideas, build your</tspan>
        <tspan x="20" dy="16">audience and grow influence.</tspan>
      </text>
    </g>

    <!-- Card 3: Brochure Websites -->
    <g transform="translate(600, 0)" filter="url(#cardShadow)">
      <rect width="280" height="165" rx="20" fill="#ffffff" />
      <rect x="20" y="20" width="44" height="44" rx="12" fill="#f3e8ff" />
      <text x="42" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#7c3aed" text-anchor="middle">📖</text>
      <text x="20" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#0f172a">Brochure Websites</text>
      <text x="20" y="118" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748b">
        <tspan x="20" dy="0">Showcase your business with</tspan>
        <tspan x="20" dy="16">beautiful informative sites.</tspan>
      </text>
    </g>

    <!-- Card 4: Personal Websites -->
    <g transform="translate(0, 185)" filter="url(#cardShadow)">
      <rect width="280" height="165" rx="20" fill="#ffffff" />
      <rect x="20" y="20" width="44" height="44" rx="12" fill="#f3e8ff" />
      <text x="42" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#7c3aed" text-anchor="middle">👤</text>
      <text x="20" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#0f172a">Personal Websites</text>
      <text x="20" y="118" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748b">
        <tspan x="20" dy="0">Build your online presence</tspan>
        <tspan x="20" dy="16">and tell your unique story.</tspan>
      </text>
    </g>

    <!-- Card 5: Business Websites -->
    <g transform="translate(300, 185)" filter="url(#cardShadow)">
      <rect width="280" height="165" rx="20" fill="#ffffff" />
      <rect x="20" y="20" width="44" height="44" rx="12" fill="#f3e8ff" />
      <text x="42" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#7c3aed" text-anchor="middle">💼</text>
      <text x="20" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#0f172a">Business Websites</text>
      <text x="20" y="118" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748b">
        <tspan x="20" dy="0">Professional websites that</tspan>
        <tspan x="20" dy="16">build trust and bring clients.</tspan>
      </text>
    </g>

    <!-- Card 6: Ecommerce Websites -->
    <g transform="translate(600, 185)" filter="url(#cardShadow)">
      <rect width="280" height="165" rx="20" fill="#ffffff" />
      <rect x="20" y="20" width="44" height="44" rx="12" fill="#f3e8ff" />
      <text x="42" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#7c3aed" text-anchor="middle">🛒</text>
      <text x="20" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#0f172a">Ecommerce Websites</text>
      <text x="20" y="118" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748b">
        <tspan x="20" dy="0">Sell products and services</tspan>
        <tspan x="20" dy="16">online with secure checkout.</tspan>
      </text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 4 VALUE PILLARS STRIP                                                    -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 875)">
    <rect width="880" height="85" rx="16" fill="#0c051a" stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Pillar 1 -->
    <g transform="translate(30, 22)">
      <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" fill="#ffffff">📱 Mobile Responsive</text>
      <text x="24" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">Looks great on all devices</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(250, 22)">
      <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" fill="#ffffff">🛡️ Secure &amp; Reliable</text>
      <text x="24" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">Your data, our priority</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(470, 22)">
      <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" fill="#ffffff">⚡ Fast Loading</text>
      <text x="24" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">Better experience, higher results</text>
    </g>

    <!-- Pillar 4 -->
    <g transform="translate(690, 22)">
      <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" fill="#ffffff">🎧 Ongoing Support</text>
      <text x="24" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">We're with you every step</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- CTA, CONTACT & QR CODE BANNER                                            -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 990)">
    <!-- CTA Button Left -->
    <g transform="translate(0, 10)">
      <rect width="280" height="58" rx="29" fill="url(#purpleRibbon)" filter="url(#cardShadow)" />
      <text x="140" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="1">GET STARTED TODAY →</text>
      <text x="140" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#cbd5e1" text-anchor="middle">Let's turn your ideas into a powerful presence.</text>
    </g>

    <!-- Contact Info Middle -->
    <g transform="translate(350, 12)">
      <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" fill="#ffffff">⚡ Studio Desk Online</text>
      <text x="0" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#c084fc">✉️ info@rtsoncreations.co.zw</text>
      <text x="0" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#e2e8f0">🌐 www.rtsoncreations.co.zw</text>
    </g>

    <!-- QR Code Right -->
    <g transform="translate(730, 0)">
      <rect width="90" height="90" rx="12" fill="#ffffff" />
      <!-- Simplified Stylized QR Code Pattern -->
      <g fill="#1e1035">
        <rect x="10" y="10" width="22" height="22" rx="4" fill="#7c3aed" /><rect x="14" y="14" width="14" height="14" fill="#ffffff" /><rect x="17" y="17" width="8" height="8" fill="#7c3aed" />
        <rect x="58" y="10" width="22" height="22" rx="4" fill="#7c3aed" /><rect x="62" y="14" width="14" height="14" fill="#ffffff" /><rect x="65" y="17" width="8" height="8" fill="#7c3aed" />
        <rect x="10" y="58" width="22" height="22" rx="4" fill="#7c3aed" /><rect x="14" y="62" width="14" height="14" fill="#ffffff" /><rect x="17" y="65" width="8" height="8" fill="#7c3aed" />
        <rect x="38" y="14" width="8" height="8" /><rect x="42" y="26" width="6" height="6" />
        <rect x="36" y="38" width="18" height="18" fill="#7c3aed" />
        <rect x="60" y="38" width="8" height="8" /><rect x="70" y="48" width="10" height="10" />
        <rect x="38" y="62" width="12" height="6" /><rect x="54" y="68" width="8" height="8" />
        <rect x="68" y="66" width="12" height="12" fill="#7c3aed" />
      </g>
      <text x="45" y="105" font-family="'Caveat', cursive, sans-serif" font-weight="700" font-size="16" fill="#c084fc" text-anchor="middle">Scan &amp; Get in Touch</text>
    </g>
  </g>

  <!-- Bottom Strip -->
  <g transform="translate(0, 1205)">
    <rect width="1000" height="45" fill="#08020f" />
    <text x="500" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="13" fill="#cbd5e1" text-anchor="middle" letter-spacing="4">
      WEBSITES <tspan fill="#a855f7">•</tspan> DESIGNS <tspan fill="#a855f7">•</tspan> BRANDS <tspan fill="#a855f7">•</tspan> YOUR SUCCESS
    </text>
  </g>
</svg>
