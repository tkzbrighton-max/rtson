<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vibrant Radiant Orange Gradient -->
    <linearGradient id="bgOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="50%" stop-color="#FF5400" />
      <stop offset="100%" stop-color="#D93800" />
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow Filter for depth in browser tab -->
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Solid Orange Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgOrangeGrad)" />
  <rect width="512" height="256" rx="112" fill="url(#glossGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="#FFA740" stroke-width="8" stroke-opacity="0.6" />

  <!-- Iconic Rtson Sculpted Geometric "R" in Pristine Contrast -->
  <g filter="url(#markShadow)">
    <!-- Base R White Foundation -->
    <path 
      d="M128 88 H296 C364 88 412 136 412 204 C412 262 368 304 304 314 L304 316 L396 424 H300 L216 320 H188 V424 H128 V88 Z 
         M188 144 V264 H292 C332 264 356 240 356 204 C356 168 332 144 292 144 H188 Z" 
      fill="#FFFFFF" 
      fill-rule="evenodd" 
    />

    <!-- Dynamic Contrast Speed Wedge (R'tson Core Brand Element) -->
    <path 
      d="M80 188 L128 140 V204 L80 252 Z" 
      fill="#050505" 
    />
    <path 
      d="M228 320 L300 424 H244 L188 348 Z" 
      fill="#050505" 
    />
    <!-- Golden Apex Accent Point -->
    <circle cx="340" cy="156" r="14" fill="#FFD000" />
  </g>
</svg>
